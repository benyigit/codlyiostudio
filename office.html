<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f8fb" />
    <title>Codlyio Studio — Office</title>
    <script>
      try {
        document.documentElement.classList.toggle("light-theme", localStorage.getItem("codly-studio-theme") !== "dark");
      } catch {
        document.documentElement.classList.add("light-theme");
      }
    </script>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar">
        <div class="brand"><img class="brand-logo" src="/brand-mark.png?v=2" alt=""><span>Codlyio Studio</span></div>
        <nav id="side-nav" aria-label="Ana menü">
          <button class="nav-item active" data-page="office"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3.5 10 8.5-7 8.5 7v10a1 1 0 0 1-1 1h-15a1 1 0 0 1-1-1z"/><path d="M9 21v-7h6v7"/></svg></span>Office</button>
          <button class="nav-item" data-page="manager"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11.5a7.5 7.5 0 0 1-7.5 7.5H6l-3 2v-5.5A7.5 7.5 0 1 1 20 11.5Z"/><path d="m16.5 4 .6 1.8L19 6.5l-1.9.7-.6 1.8-.6-1.8-1.9-.7 1.9-.7z"/></svg></span>Manager</button>

          <div class="nav-label">WORK</div>
          <button class="nav-item" data-page="tasks"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 6 1.5 1.5L8 5"/><path d="M11 6h9M4 12l1.5 1.5L8 11"/><path d="M11 12h9M4 18l1.5 1.5L8 17"/><path d="M11 18h9"/></svg></span>Tasks</button>
          <button class="nav-item" data-page="projects"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5H10l2 2h7.5A1.5 1.5 0 0 1 21 8.5v9a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5z"/></svg></span>Projects</button>
          <button class="nav-item" data-page="development"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 8-4 4 4 4M16 8l4 4-4 4M14 5l-4 14"/></svg></span>Development</button>
          <button class="nav-item" data-page="artifacts"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.5h8l4 4v13H6z"/><path d="M14 3.5v4h4M9 12h6M9 16h6"/><path d="M3 7v14h12"/></svg></span>Artifacts</button>
          <button class="nav-item" data-page="approvals"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4.5h8M9 3h6v3H9z"/><path d="M7 5H5v16h14V5h-2"/><path d="m8.5 13 2.5 2.5 5-5"/></svg></span>Approvals <span id="approval-count" class="nav-count hidden">0</span></button>
          <button class="nav-item" data-page="activity"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h4l3-7 4 14 3-7h4"/></svg></span>Activity</button>

          <div class="nav-label">GROWTH</div>
          <button class="nav-item" data-page="content"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3.5h14v17H5z"/><path d="M8 8h8M8 12h8M8 16h5"/></svg></span>Content</button>
          <button class="nav-item" data-page="calendar"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="16" rx="2"/><path d="M7.5 3v4M16.5 3v4M3.5 10h17M8 14h2M14 14h2M8 17h2"/></svg></span>Calendar</button>
          <button class="nav-item" data-page="campaigns"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13V9a1 1 0 0 1 1-1h3l10-4v16L8 16H5a1 1 0 0 1-1-1z"/><path d="m8 16 2 5h3l-2.3-4.1M20 9l2-1M20 13h2M20 17l2 1"/></svg></span>Campaigns</button>
          <button class="nav-item" data-page="analytics"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V11M10 20V5M16 20v-8M22 20H2"/></svg></span>Analytics</button>

          <div class="nav-label">TEAM</div>
          <button class="nav-item" data-page="employees"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 20v-1.5a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4V20M9.5 10.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7ZM16 4a3.5 3.5 0 0 1 0 7M17 14.5a4 4 0 0 1 4 4V20"/></svg></span>Employees</button>
          <button class="nav-item" data-page="departments"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="6" rx="1.5"/><rect x="3" y="14" width="8" height="6" rx="1.5"/><rect x="15" y="14" width="6" height="6" rx="1.5"/><path d="M7 7h.01M12 7h.01M7 17h.01M18 17h.01"/></svg></span>Departments</button>

          <div class="nav-label">AUTOMATION</div>
          <button class="nav-item" data-page="workflows"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="6" r="2"/><circle cx="18" cy="18" r="2"/><path d="M8 6h5a3 3 0 0 1 3 3v6M16 18h-5a3 3 0 0 1-3-3V9"/></svg></span>Workflows</button>

          <div class="nav-label">WORKSPACE</div>
          <button class="nav-item" data-page="integrations"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 7V3M16 7V3M7 7h10v5a5 5 0 0 1-10 0zM12 17v4"/></svg></span>Integrations</button>
          <button class="nav-item" data-page="usage"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19a9 9 0 1 1 16 0"/><path d="m12 13 4-4M6 19h12"/><circle cx="12" cy="13" r="1"/></svg></span>Usage</button>
          <button class="nav-item" data-page="settings"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg></span>Settings</button>
        </nav>
        <div class="sidebar-foot"><span class="online-dot" id="runtime-dot"></span><span id="runtime-mode">Connecting to local runtime…</span></div>
      </aside>

      <header class="topbar">
        <button class="workspace-switch" id="workspace-switch">Codlyio Studio <span>⌄</span></button>
        <div class="topbar-actions">
          <span class="live-pill" id="runtime-indicator"><span class="online-dot" id="runtime-pill-dot"></span> Connecting…</span>
          <button class="icon-button" id="notifications-button" aria-label="Notifications">♧<span class="notification-dot"></span></button>
          <button class="stop-button" id="stop-all">⊗ <span>Stop all</span></button>
          <button class="user-avatar" id="account-menu" aria-label="Account">Y</button>
        </div>
      </header>

      <main id="view" class="view" tabindex="-1"></main>
    </div>

    <div id="modal-root"></div>
    <div id="auth-screen" class="auth-screen hidden"></div>
    <div id="workspace-onboarding" class="auth-screen hidden"></div>
    <script src="/i18n.js"></script>
    <script src="/node_modules/@supabase/supabase-js/dist/umd/supabase.js"></script>
    <script type="module" src="/app.js"></script>
  </body>
</html>
